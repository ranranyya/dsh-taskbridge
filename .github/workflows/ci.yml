name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - name: Configure Git identity for worktree tests
        run: |
          git config --global user.name "TaskBridge CI"
          git config --global user.email "ci@taskbridge.invalid"
      - name: Install dependencies
        run: npm ci
      - name: Check host integration outputs
        run: npm run check:integrations
      - name: Check client bundle sync
        env:
          DSH_TASKBRIDGE_CLIENT_PLATFORM: win32
        run: npm run check:client
      - name: Run test suite
        run: npm test
      - name: Dry-run npm pack
        run: npm run pack:dry
